<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="620" viewBox="0 0 1600 620" role="img" aria-labelledby="title desc">
  <title id="title">AgentWatch Hub</title>
  <desc id="desc">Codex and Claude Code completion notifications delivered to Bark</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1020"/>
      <stop offset="0.58" stop-color="#101a33"/>
      <stop offset="1" stop-color="#152241"/>
    </linearGradient>
    <linearGradient id="signal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#66f2ac"/>
      <stop offset="1" stop-color="#67a8ff"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#93a9d2" stroke-opacity=".08"/>
    </pattern>
  </defs>

  <rect width="1600" height="620" rx="36" fill="url(#bg)"/>
  <rect width="1600" height="620" rx="36" fill="url(#grid)"/>
  <circle cx="1330" cy="120" r="190" fill="#5e8fff" opacity=".11" filter="url(#glow)"/>
  <circle cx="730" cy="560" r="170" fill="#5df0a1" opacity=".08" filter="url(#glow)"/>

  <g transform="translate(82 70)" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif">
    <g transform="translate(0 0)">
      <rect width="54" height="54" rx="17" fill="url(#signal)"/>
      <circle cx="27" cy="27" r="6" fill="#07111f"/>
      <path d="M17 27a10 10 0 0 1 20 0M11 27a16 16 0 0 1 32 0" fill="none" stroke="#07111f" stroke-width="3" stroke-linecap="round"/>
      <text x="72" y="37" fill="#f4f8ff" font-size="28" font-weight="750" letter-spacing="1">AGENTWATCH / HUB</text>
    </g>

    <text x="0" y="130" fill="#66f2ac" font-size="18" font-weight="700" letter-spacing="3">CODEX · CLAUDE CODE · BARK</text>
    <text x="0" y="205" fill="#ffffff" font-size="58" font-weight="780">让 Agent 跑，</text>
    <text x="0" y="280" fill="#ffffff" font-size="58" font-weight="780">让手机叫你回来。</text>
    <text x="2" y="338" fill="#b9c6df" font-size="23">完成时提醒你，而不是让你一直盯着终端。</text>

    <g transform="translate(0 388)">
      <rect width="200" height="48" rx="24" fill="#66f2ac" fill-opacity=".13" stroke="#66f2ac" stroke-opacity=".45"/>
      <circle cx="26" cy="24" r="6" fill="#66f2ac"/>
      <text x="44" y="31" fill="#dfffee" font-size="17" font-weight="650">NOTIFY-FIRST PREVIEW</text>
    </g>
    <text x="0" y="488" fill="#8192b2" font-size="16">LOCAL-FIRST  /  REVERSIBLE  /  LLM PERSONAS</text>
  </g>

  <g transform="translate(930 72)" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif">
    <rect width="586" height="476" rx="30" fill="#080d18" stroke="#334466" stroke-width="2"/>
    <circle cx="32" cy="30" r="6" fill="#ff6b7b"/>
    <circle cx="53" cy="30" r="6" fill="#ffc857"/>
    <circle cx="74" cy="30" r="6" fill="#66f2ac"/>
    <text x="506" y="36" fill="#667797" font-size="14">21:31</text>

    <g transform="translate(28 70)">
      <text x="0" y="0" fill="#7184a7" font-size="15">~/projects/agentwatch</text>
      <text x="0" y="38" fill="#e9efff" font-size="18"><tspan fill="#66f2ac">$</tspan> codex "run tests and package"</text>
      <rect x="0" y="62" width="420" height="10" rx="5" fill="#1c2941"/>
      <rect x="0" y="62" width="420" height="10" rx="5" fill="url(#signal)"/>
      <text x="0" y="105" fill="#66f2ac" font-size="16" font-weight="650">✓ 10 tests passed · build complete</text>
    </g>

    <path d="M293 202v34" stroke="#66f2ac" stroke-width="3" stroke-linecap="round"/>
    <circle cx="293" cy="218" r="16" fill="#66f2ac" fill-opacity=".15" stroke="#66f2ac"/>
    <path d="m286 218 5 5 10-11" fill="none" stroke="#66f2ac" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <g transform="translate(27 250)">
      <rect width="532" height="190" rx="24" fill="#14213b" stroke="#48648f"/>
      <rect x="20" y="20" width="42" height="42" rx="13" fill="url(#signal)"/>
      <path d="M34 41h14M41 34v14" stroke="#0b1425" stroke-width="3" stroke-linecap="round"/>
      <text x="80" y="39" fill="#91a4c7" font-size="15" font-weight="650">AGENTWATCH · NOW</text>
      <text x="20" y="92" fill="#ffffff" font-size="26" font-weight="730">总裁，战报出炉了 📋</text>
      <text x="20" y="130" fill="#c8d5eb" font-size="18">这仗打得漂亮，结果已经送到手机。</text>
      <text x="20" y="162" fill="#6eeeb0" font-size="15">OpenAI Codex · agentwatch-hub</text>
    </g>
  </g>
</svg>
