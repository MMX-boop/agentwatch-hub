[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentwatch-hub"
version = "0.1.0"
description = "Bark completion notifications for Codex CLI and Claude Code, with optional LLM personas"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "MMX-boop" }]
keywords = ["codex", "claude-code", "bark", "notification", "coding-agent"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Build Tools",
]
dependencies = [
  "filelock>=3.16,<4",
  "httpx>=0.28,<1",
  "pydantic-settings>=2.8,<3",
  "tomlkit>=0.13,<1",
  "typer>=0.16,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[project.scripts]
agentwatch-notify = "agentwatch_notify.cli:app"

[project.urls]
Homepage = "https://github.com/MMX-boop/agentwatch-hub"
Issues = "https://github.com/MMX-boop/agentwatch-hub/issues"

[tool.hatch.build.targets.wheel]
packages = ["agentwatch_notify"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
